name: Deploy (rsync + docker compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Escribir clave SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Copiar repo al servidor (sin .git para ahorrar)
      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avzr --delete \
            --exclude ".git" --exclude ".github" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${SSH_USER}@${SSH_HOST}:/opt/lw-app/"

      # Escribir .env localmente y subirlo al servidor
      - name: Upload .env to server
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '%s\n' "$ENV_FILE" > /tmp/deploy.env
          sed -i 's/^[[:space:]]*//' /tmp/deploy.env
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              /tmp/deploy.env \
              "${SSH_USER}@${SSH_HOST}:/opt/lw-app/.env"
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${SSH_USER}@${SSH_HOST}" \
              "chmod 600 /opt/lw-app/.env"

      # Levantar stack
      - name: Compose up
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${SSH_USER}@${SSH_HOST}" \
              "set -e && cd /opt/lw-app && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
