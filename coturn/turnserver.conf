# coturn configuration for LightWeight WebRTC
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# Listening ports
listening-port=3478
tls-listening-port=5349

# Public IP of the server — coturn needs this when running behind NAT/Docker
# Replace with your actual public IP or domain
external-ip=lightweight.cat

# Credentials — must match VITE_TURN_USERNAME and VITE_TURN_CREDENTIAL in .env
user=lightweight:LightWeight123

# Realm (any string, usually your domain)
realm=lightweight.cat

# Use long-term credential mechanism (static user/password)
lt-cred-mech

# Logging — write to stdout so Docker captures it
no-stdout-log
log-file=stdout

# Security: only relay between authenticated peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Fingerprint on TURN messages
fingerprint
